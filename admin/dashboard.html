<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Admin Panel</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">Admin Panel</div>
        <nav class="sidebar-nav">
            <ul>
                <li><a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="news.html"><i class="fas fa-newspaper"></i> News</a></li>
                <li><a href="opportunities.html"><i class="fas fa-briefcase"></i> Opportunities</a></li>
                <li><a href="registrations.html"><i class="fas fa-users"></i> Registrations</a></li>
                <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Dashboard</h1>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-newspaper"></i></div>
                <div class="stat-details">
                    <h3>Total News</h3>
                    <p id="totalNews">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--success); background: #d1fae5;"><i class="fas fa-check-circle"></i></div>
                <div class="stat-details">
                    <h3>Published News</h3>
                    <p id="publishedNews">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--warning); background: #fef3c7;"><i class="fas fa-file-alt"></i></div>
                <div class="stat-details">
                    <h3>Draft News</h3>
                    <p id="draftNews">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-briefcase"></i></div>
                <div class="stat-details">
                    <h3>Total Opportunities</h3>
                    <p id="totalOpportunities">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--warning); background: #fef3c7;"><i class="fas fa-calendar-check"></i></div>
                <div class="stat-details">
                    <h3>Total Events</h3>
                    <p id="totalEvents">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--success); background: #d1fae5;"><i class="fas fa-calendar-alt"></i></div>
                <div class="stat-details">
                    <h3>Upcoming Opportunities</h3>
                    <p id="upcomingOpportunities">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color: var(--info); background: #dbeafe;"><i class="fas fa-users"></i></div>
                <div class="stat-details">
                    <h3>Total Registrations</h3>
                    <p id="totalRegistrations">0</p>
                </div>
            </div>
        </div>
    </main>
    <script src="js/admin.js"></script>
</body>
</html>
